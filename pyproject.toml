[project]
name = "femaktiv"
version = "0.1.0"
description = "A bilingual personal workspace for life's everyday questions"
requires-python = ">=3.14,<3.15"
dependencies = [
  "django>=5.2.17,<5.3",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = ["ruff>=0.12", "playwright>=1.55", "polib>=1.2"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".session", "bin/depemesh", "staticfiles", "*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false
