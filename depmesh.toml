version = 1

# Contract: specs/behavior/files_relations.md.
# Discovery uses constant roots and exact predicates to preserve literal path names.

[[relations]]
id = "governed_by"
description = "Specifications whose requirements apply to the artifact."

[[relations]]
id = "governs"
description = "Existing files governed by the specification."

[[relations]]
id = "tested_by"
description = "Existing unit and explicitly assigned browser tests for the source file."

[[relations]]
id = "tests"
description = "Existing source files assigned to the test."

# Specification authoring.

[[rules]]
relation = "governed_by"
input = { type = "all", items = [{ type = "any", items = [{ type = "regex", pattern = "^@/specs/.+\\.md$" }, { type = "one_of", artifacts = ["@/AGENTS.md"] }] }, { type = "not", item = { type = "one_of", artifacts = ["@/specs/meta/general.md"] } }, { type = "not", item = { type = "regex", pattern = "^@/(?:.*/)?(?:\\.git|\\.session|\\.agents|\\.codex|node_modules|\\.next|dist|build|coverage|playwright-report|test-results|\\.venv|__pycache__|\\.cache|\\.local|\\.ruff_cache|\\.pytest_cache|staticfiles)(?:/|$)|^@/(?:.*/)?(?:\\.env(?:\\..*)?|.*\\.(?:pyc|pem|key|mo|sqlite|sqlite3|db)(?:-wal|-shm|-journal)?)$" } }] }
output = { type = "files", pattern = "@/specs/meta/general.md" }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/meta/general.md"] }
output = { type = "filter", source = { type = "command", command = "python3 bin/depemesh/files.py specs AGENTS.md" }, predicate = { type = "all", items = [{ type = "any", items = [{ type = "regex", pattern = "^@/specs/.+\\.md$" }, { type = "one_of", artifacts = ["@/AGENTS.md"] }] }, { type = "not", item = { type = "one_of", artifacts = ["@/specs/meta/general.md"] } }, { type = "not", item = { type = "regex", pattern = "^@/(?:.*/)?(?:\\.git|\\.session|\\.agents|\\.codex|node_modules|\\.next|dist|build|coverage|playwright-report|test-results|\\.venv|__pycache__|\\.cache|\\.local|\\.ruff_cache|\\.pytest_cache|staticfiles)(?:/|$)|^@/(?:.*/)?(?:\\.env(?:\\..*)?|.*\\.(?:pyc|pem|key|mo|sqlite|sqlite3|db)(?:-wal|-shm|-journal)?)$" } }] } }

